name: 每日抓取新聞

on:
  schedule:
    # 一天四次。TechCrunch 這類發稿快的來源，feed 只裝得下 9 小時的量，
    # 一天只抓一次會漏掉中間發的文章，所以每 6 小時抓一次。
    # UTC 23/05/11/17 = 台北時間 07:00 / 13:00 / 19:00 / 01:00
    - cron: '0 23,5,11,17 * * *'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下就執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取 RSS
        run: node scripts/fetch-feeds.mjs

      - name: 有更新才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.js
          if git diff --staged --quiet; then
            echo "沒有新文章，不需要 commit"
          else
            git commit -m "更新新聞資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
