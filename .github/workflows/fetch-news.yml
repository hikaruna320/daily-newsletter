name: 每日抓取新聞

on:
  schedule:
    # 每兩小時一次（台北時間 08:43、10:43、12:43…，一天 12 次）。
    #
    # 為什麼要排這麼密：GitHub 對免費倉庫的排程是「盡力而為」，他們佇列忙的時候
    # 會直接跳過，跳過的不會補跑。原本設一天 4 次，實測下來一天只真的跑到 2 次，
    # 縫隙動輒 10～13 小時。而 INSIDE 的 feed 固定只給 10 篇、不支援分頁，
    # 平日上班時間 4 小時就能發 9 篇 —— 縫隙一拉長，中間發的文章就永遠抓不到了。
    # （2026-11-11 的 Disney x Adobe 那篇就是這樣掉的。）
    #
    # 解法不是把排程排準（排不準），而是把基數放大：排 12 次、GitHub 跳掉一半，
    # 實際也還有 5～6 次，縫隙就縮到 4 小時以內。
    - cron: '43 */2 * * *'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下就執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 RSS
        run: node scripts/fetch-feeds.mjs

      - name: 有更新才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.js
          if git diff --staged --quiet; then
            echo "沒有新文章，不需要 commit"
          else
            git commit -m "更新新聞資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
